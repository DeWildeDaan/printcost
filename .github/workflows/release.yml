name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - run: go test ./...
      # Creates tag vX.Y.Z + GitHub release from conventional commits (no-op if nothing releasable).
      # A PAT is required: a tag pushed with GITHUB_TOKEN won't trigger CI, which builds the image/chart on v* tags.
      - run: npx semantic-release@25
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
