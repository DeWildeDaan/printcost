replicaCount: 1

image:
  repository: printcost
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  host: printcost.example.com
  tls: false

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

env:
  DB_PATH: /data/printcost.db

# The whole site is protected by OIDC/SSO login (no local accounts).
# clientSecret and sessionSecret go in a Secret, not the ConfigMap - set
# them via --set or a values override file that isn't committed.
oidc:
  issuerUrl: ""
  clientId: ""
  clientSecret: ""
  redirectUrl: ""
  sessionSecret: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
