replicaCount: 1

image:
  repository: printcost
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  host: printcost.example.com
  tls: false

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

env:
  DB_PATH: /data/printcost.db

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
